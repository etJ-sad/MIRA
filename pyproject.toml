[project]
name = "mira"
version = "0.1.0"
description = "MIRA - lokaler Wartungs-Assistent, LLM und Embeddings auf der NPU (OpenVINO)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mira = "mira.cli:main"

[tool.setuptools.packages.find]
include = ["mira*"]

[tool.setuptools.package-data]
mira = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware'"
markers = ["hardware: needs the NPU and a running OVMS with the MIRA models"]
