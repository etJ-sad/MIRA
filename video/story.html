<!doctype html>
<meta charset="utf-8">
<title>MIRA Story</title>
<!-- The whole video is drawn on one 1920x1080 canvas. kLoad() returns the length, kSeek(t) draws any frame.
     build.py injects narration timing, the measured MIRA results (assets.json) and fonts.
     Same look, score and helpers as the Lumen story video: this is its sequel. -->
<style>
@font-face{font-family:"SSans";font-weight:400;src:url(data:font/woff;base64,/*FONT_RM*/) format("woff")}
@font-face{font-family:"SSans";font-weight:700;src:url(data:font/woff;base64,/*FONT_BD*/) format("woff")}
html,body{margin:0;background:#000014;overflow:hidden}
canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:auto}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const VO=/*VO*/null, DATA=/*DATA*/null, AUDIO=/*AUDIO*/null, VARIANT=/*VARIANT*/'eco';
// two cuts of the same material: 'eco' is the shared NPU story (with Lumen and Greenforest), 'solo' is MIRA on its own
const SOLO=VARIANT==='solo';
const W=1920,H=1080,cv=document.getElementById('c'),g=cv.getContext('2d');
const F='"SSans","Segoe UI",system-ui,sans-serif', MONO='"Cascadia Mono",Consolas,monospace';
// Siemens-style palette: deep blue ground, petrol light, the NPU is the only thing that glows
const C={bg:'#000028',bg2:'#00001e',line:'rgba(0,153,153,.22)',grid:'rgba(120,140,200,.07)',petrol:'#009999',npu:'#00d7c3',
  npuHi:'#7dfff0',txt:'#ffffff',mute:'#9aa0bd',dim:'#4a5070',cpu:'#7f8ab8',gpu:'#a98fd6',nok:'#ff6a3d',ok:'#3ee0a0',amber:'#ffb000',panel:"rgba(10,14,52,.95)"};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},
  eo=x=>1-Math.pow(1-cl(x),3), ramp=(t,a,b)=>cl((t-a)/(b-a)), lerp=(a,b,x)=>a+(b-a)*x;
let IM={}, LOGO=null;
function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
window.kReady=(async()=>{
  const files=['app_answer.jpg','source_page.png'];
  await Promise.all(files.map(async f=>IM[f]=await load((DATA.images&&DATA.images[f])||'assets/'+f)));
  if(window.MIRA_LOGO_URL)LOGO=await load(window.MIRA_LOGO_URL);
  await document.fonts.ready;return true})();

// ---------- drawing helpers ----------
function T(s,x,y,o={}){o.s=Math.max(o.s||40,22);g.save();g.globalAlpha*=o.a??1;g.font=`${o.w||400} ${o.s||40}px ${o.mono?MONO:F}`;g.fillStyle=o.c||C.txt;
  g.textAlign=o.al||'left';g.textBaseline=o.bl||'alphabetic';if(o.ls)g.letterSpacing=o.ls+'px';if(o.glow){g.shadowColor=o.glow;g.shadowBlur=o.gb||24}
  g.fillText(s,x,y);const m=g.measureText(s).width;g.restore();return m}
function R(x,y,w,h,o={}){g.save();g.globalAlpha*=o.a??1;g.beginPath();g.roundRect(x,y,w,h,o.r??6);if(o.f){g.fillStyle=o.f;if(o.glow){g.shadowColor=o.glow;g.shadowBlur=o.gb||30}g.fill()}
  if(o.s){g.shadowBlur=0;g.strokeStyle=o.s;g.lineWidth=o.lw||2;g.stroke()}g.restore()}
function L(pts,o={}){g.save();g.globalAlpha*=o.a??1;g.strokeStyle=o.c||C.line;g.lineWidth=o.lw||2;if(o.dash)g.setLineDash(o.dash);if(o.glow){g.shadowColor=o.glow;g.shadowBlur=o.gb||16}
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.restore()}
function img(name,x,y,w,h,a=1){const i=IM[name];if(!i)return R(x,y,w,h,{f:'#111a44',a});g.save();g.globalAlpha*=a;g.drawImage(i,x,y,w,h);g.restore()}
function fade(t,d,i=.45,o=.35){return Math.min(ramp(t,0,i),ramp(d-t,0,o))}
function label(x,y,k,v,o={}){T(k.toUpperCase(),x,y,{s:o.ks||24,c:C.mute,ls:3,a:o.a});T(v,x,y+(o.vs||46)+8,{s:o.vs||46,w:700,c:o.c||C.txt,a:o.a,mono:o.mono,glow:o.glow})}
function chip(x,y,txt,col,a=1){g.save();g.font=`700 22px ${F}`;const w=g.measureText(txt).width+36;g.restore();
  R(x,y,w,40,{r:20,f:'rgba(0,0,40,.6)',s:col,lw:2,a});T(txt,x+18,y+28,{s:22,w:700,c:col,a});return w}
function rng(seed){let s=seed>>>0;return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,(s>>>0)/4294967296))}
const fmt=(n,d=0)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

// ---------- background: blueprint grid, slow drift ----------
function ground(t,glow=0){g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  const gr=g.createRadialGradient(W*.62,H*.55,50,W*.62,H*.55,1100);gr.addColorStop(0,`rgba(0,120,130,${.10+.12*glow})`);gr.addColorStop(1,'rgba(0,0,30,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.strokeStyle=C.grid;g.lineWidth=1;const o=(t*6)%60;g.beginPath();
  for(let x=-60+o;x<W+60;x+=60){g.moveTo(x,0);g.lineTo(x,H)}for(let y=-60+o*.5;y<H+60;y+=60){g.moveTo(0,y);g.lineTo(W,y)}g.stroke();g.restore()}

// ---------- the SoC die: CPU, GPU and the NPU ----------
const DIE={x:470,y:190,w:980,h:640};
const BL={cpu:{x:DIE.x+40,y:DIE.y+40,w:440,h:380},gpu:{x:DIE.x+510,y:DIE.y+40,w:430,h:250},npu:{x:DIE.x+510,y:DIE.y+320,w:430,h:280},
  io:{x:DIE.x+40,y:DIE.y+450,w:440,h:150}};
function die(t,st){ // st: {cpu,gpu,npu:0..1 light, npuAct:0..1 activity, a}
  const a=st.a??1;g.save();g.globalAlpha*=a;
  R(DIE.x,DIE.y,DIE.w,DIE.h,{r:10,f:'rgba(4,8,40,.9)',s:'rgba(0,153,153,.5)',lw:2});
  for(let i=0;i<34;i++){const px=DIE.x+20+i*28;R(px,DIE.y-14,14,8,{r:1,f:'rgba(0,153,153,.35)'});R(px,DIE.y+DIE.h+6,14,8,{r:1,f:'rgba(0,153,153,.35)'})}
  for(let i=0;i<22;i++){const py=DIE.y+20+i*28;R(DIE.x-14,py,8,14,{r:1,f:'rgba(0,153,153,.35)'});R(DIE.x+DIE.w+6,py,8,14,{r:1,f:'rgba(0,153,153,.35)'})}
  // CPU: 8 P-cores + E-core clusters
  const c=BL.cpu,lc=st.cpu||0;R(c.x,c.y,c.w,c.h,{r:6,f:`rgba(127,138,184,${.05+.18*lc})`,s:lc?C.cpu:C.dim,lw:2});
  for(let i=0;i<8;i++){const cx=c.x+20+(i%4)*104,cy=c.y+20+Math.floor(i/4)*120;R(cx,cy,92,106,{r:4,s:lc?C.cpu:C.dim,lw:1.5,f:`rgba(127,138,184,${.08*lc+.1*lc*(.5+.5*Math.sin(t*3+i))})`})}
  for(let i=0;i<16;i++){const cx=c.x+20+(i%8)*52,cy=c.y+262+Math.floor(i/8)*42;R(cx,cy,44,34,{r:3,s:lc?C.cpu:C.dim,lw:1.2})}  // leaves room for the label
  T('CPU',c.x+c.w-18,c.y+c.h-16,{s:24,w:700,al:'right',c:lc?C.cpu:C.dim});
  // GPU: Xe cores
  const q=BL.gpu,lg=st.gpu||0;R(q.x,q.y,q.w,q.h,{r:6,f:`rgba(169,143,214,${.05+.16*lg})`,s:lg?C.gpu:C.dim,lw:2});
  for(let i=0;i<8;i++){const cx=q.x+18+(i%4)*102,cy=q.y+18+Math.floor(i/4)*102;R(cx,cy,90,90,{r:4,s:lg?C.gpu:C.dim,lw:1.5})
    for(let k=0;k<4;k++)L([[cx+12,cy+18+k*18],[cx+78,cy+18+k*18]],{c:lg?'rgba(169,143,214,.5)':'rgba(74,80,112,.5)',lw:1})}
  T('GPU',q.x+q.w-18,q.y+q.h-16,{s:24,w:700,al:'right',c:lg?C.gpu:C.dim});
  // NPU: MAC array, lights up and works
  const n=BL.npu,ln=st.npu||0,act=st.npuAct||0;
  R(n.x,n.y,n.w,n.h,{r:6,f:`rgba(0,215,195,${.03+.14*ln})`,s:ln?C.npu:C.dim,lw:ln?3:2,glow:ln?C.npu:null,gb:40*ln});
  const r=rng(7);for(let i=0;i<6;i++)for(let j=0;j<4;j++){const cx=n.x+20+i*66,cy=n.y+20+j*54,ph=r()*6.28,sp=2+r()*5;
    const on=ln*(.25+.75*act*(.5+.5*Math.sin(t*sp+ph)));R(cx,cy,56,44,{r:3,f:`rgba(0,215,195,${.06+.55*on})`,s:ln?'rgba(125,255,240,.55)':C.dim,lw:1.2})}
  T('NPU',n.x+n.w-18,n.y+n.h-16,{s:24,w:700,al:'right',c:ln?C.npuHi:C.dim,glow:ln?C.npu:null});
  if(!ln&&st.wait){g.save();g.globalAlpha*=.4+.3*Math.sin(t*2.4);R(n.x,n.y,n.w,n.h,{r:6,s:'rgba(0,153,153,.5)',lw:2});g.restore()}
  // I/O and memory
  const io=BL.io;R(io.x,io.y,io.w,io.h,{r:6,s:C.dim,lw:1.5});for(let i=0;i<6;i++)R(io.x+16+i*70,io.y+18,58,90,{r:3,s:'rgba(74,80,112,.7)',lw:1});
  T('MEMORY · I/O',io.x+io.w-18,io.y+io.h-16,{s:18,al:'right',c:C.dim,ls:2});
  g.restore()}
function zoomTo(box,z,fn,tx=W*.4,ty=H*.48){ // the box centre glides to (tx,ty) while the view scales by z
  const cx=box.x+box.w/2,cy=box.y+box.h/2,k=ease(cl((z-1)/.5));g.save();g.translate(lerp(cx,tx,k),lerp(cy,ty,k));g.scale(z,z);g.translate(-cx,-cy);fn();g.restore()}

// the real app in a monitor frame (MIRA web UI screenshot, 1584x861); a spotlight glides between regions (screenshot pixels, start as fraction of the scene)
function appShot(name,t,d,spots,caption){const im=IM[name],sw=1584,sh=861,fw=1400,fh=fw*sh/sw,fx=(W-fw)/2,fy=150,sc=fw/sw;
  let k=-1;spots.forEach((p,j)=>{if(t>=p[4]*d)k=j});const sa=k<0?0:ramp(t,spots[0][4]*d,spots[0][4]*d+.5);
  let r=null;if(k>=0){const cur=spots[k],prev=spots[Math.max(0,k-1)],m=ease(ramp(t,cur[4]*d,cur[4]*d+.6));r=[0,1,2,3].map(q=>lerp(prev[q],cur[q],k?m:1))}
  const cx=r?fx+(r[0]+r[2])/2*sc:W/2,cy=r?fy+(r[1]+r[3])/2*sc:H/2,z=1+.42*sa;
  g.save();g.translate(cx,cy);g.scale(z,z);g.translate(-cx,-cy);
  R(fx-16,fy-16,fw+32,fh+32,{r:14,f:'#070a22',s:'rgba(0,153,153,.45)',lw:2,glow:'rgba(0,0,0,.7)',gb:70});if(im)g.drawImage(im,fx,fy,fw,fh);
  if(r){const x0=fx+r[0]*sc-10,y0=fy+r[1]*sc-10,x1=fx+r[2]*sc+10,y1=fy+r[3]*sc+10;g.save();g.beginPath();g.rect(fx,fy,fw,fh);g.roundRect(x0,y0,x1-x0,y1-y0,8);
    g.fillStyle=`rgba(0,0,30,${.62*sa})`;g.fill('evenodd');g.restore();R(x0,y0,x1-x0,y1-y0,{r:8,s:C.npu,lw:3,a:sa,glow:C.npu,gb:26})}
  g.restore();T(caption,fx+fw,fy+fh+56,{s:22,al:'right',c:C.mute,ls:4,a:ramp(t,.4,1)})}

// ---------- MIRA helpers: wrapped text, chat bubbles, the measured answer replayed by its token timestamps ----------
function wrap(s,maxW,o={}){g.save();g.font=`${o.w||400} ${o.s||30}px ${o.mono?MONO:F}`;const out=[];
  s.split('\n').forEach(par=>{let line='';par.split(' ').forEach(wd=>{const tr=line?line+' '+wd:wd;if(g.measureText(tr).width>maxW&&line){out.push(line);line=wd}else line=tr});out.push(line)});g.restore();return out}
function para(s,x,y,maxW,o={}){const lh=o.lh||(o.s||30)*1.42;wrap(s,maxW,o).forEach((l,i)=>T(l,x,y+i*lh,o));return wrap(s,maxW,o).length*lh}
function bubble(s,x,y,maxW,a=1,col=C.txt){const ls=wrap(s,maxW-56,{s:32});g.save();g.font=`400 32px ${F}`;const w=Math.max(...ls.map(l=>g.measureText(l).width))+56;g.restore();
  const h=ls.length*44+36;R(x-w,y,w,h,{r:18,f:'rgba(30,40,90,.95)',s:'rgba(125,255,240,.25)',lw:1.5,a});ls.forEach((l,i)=>T(l,x-w+28,y+50+i*44,{s:32,c:col,a}));return h}
const short=m=>(m||'').split('/').pop(), typed=(s,p)=>s.slice(0,Math.floor(s.length*cl(p)));
const A=()=>DATA.assets, PRE=()=>!!A().placeholder;
function replay(r,el){const L=r.llm||{},st=L.stamps||[];const n=st.filter(s=>s<=el).length;return st.length?Math.min(r.answer.length,Math.round(r.answer.length*n/st.length)):Math.round(r.answer.length*cl(el/(r.seconds||1)))}
function scoreBar(x,y,w,s,thr,a,lbl){R(x,y,w,14,{r:7,f:'rgba(120,140,200,.12)',a});const ok=s>=thr;R(x,y,Math.max(4,w*s),14,{r:7,f:ok?C.npu:C.nok,a,glow:ok?C.npu:null,gb:10});
  L([[x+w*thr,y-10],[x+w*thr,y+24]],{c:C.amber,lw:2,a});if(lbl)T(lbl,x+w+20,y+14,{s:22,mono:true,c:ok?C.npuHi:C.nok,a})}

// ---------- scenes (one per narration block in script.json) ----------
const ALL=[
 {id:'cold',see:'The die is drawn by a scanning light, left to right, then holds in the dark.',draw(t,d){ground(t);const p=ease(ramp(t,.6,3.4)),x=lerp(DIE.x-80,DIE.x+DIE.w+80,p);
   g.save();g.beginPath();g.rect(0,0,x,H);g.clip();die(t,{a:1});g.restore();
   if(p>0&&p<1){const gr=g.createLinearGradient(x-120,0,x,0);gr.addColorStop(0,'rgba(0,215,195,0)');gr.addColorStop(1,'rgba(125,255,240,.35)');g.fillStyle=gr;g.fillRect(x-120,DIE.y-40,120,DIE.h+80);
     L([[x,DIE.y-40],[x,DIE.y+DIE.h+40]],{c:C.npuHi,lw:2,glow:C.npu})}
   T((A().cpu_name||'').toUpperCase(),DIE.x,DIE.y+DIE.h+70,{s:20,c:C.dim,ls:5,a:ramp(t,3.2,4)});T('CPU · GPU · NPU',DIE.x+DIE.w,DIE.y+DIE.h+70,{s:20,al:'right',c:C.dim,ls:5,a:ramp(t,3.4,4.2)});}},
 {id:'cpu-gpu',see:'CPU lights, then GPU, then the NPU answers: that is me.',draw(t,d){ground(t,ramp(t,d*.7,d));const p=d/3.2;
   die(t,{cpu:ease(ramp(t,.3,1)),gpu:ease(ramp(t,p,p+.7)),npu:ease(ramp(t,d*.72,d*.85)),npuAct:.3*ramp(t,d*.8,d),wait:t>2*p});
   if(t>.5)T('runs the machine',BL.cpu.x,BL.cpu.y-22,{s:26,c:C.cpu,a:ramp(t,.5,1.1)});
   if(t>p)T('draws the screen',BL.gpu.x,BL.gpu.y-22,{s:26,c:C.gpu,a:ramp(t,p,p+.6)});
   if(t>2*p&&t<d*.75)T('?',BL.npu.x+BL.npu.w/2,BL.npu.y+BL.npu.h/2+40,{s:120,w:700,al:'center',c:C.dim,a:ramp(t,2*p,2*p+.6)*(.6+.4*Math.sin(t*3))*(1-ramp(t,d*.7,d*.75))});
   T('that\'s me',BL.npu.x+BL.npu.w,BL.npu.y+BL.npu.h+46,{s:26,al:'right',c:C.npuHi,a:ramp(t,d*.78,d*.9),glow:C.npu});}},
 {id:'eyes',see:'Zoom on the NPU; a skill list from Lumen: see defects, count objects, read text, ticked. A fourth row waits: explain.',draw(t,d){ground(t,.4);

   const a=ramp(t,.2,.8);R(120,170,620,660,{r:8,f:C.panel,s:'rgba(0,153,153,.4)',lw:1.5,a});T('SKILLS',160,232,{s:22,c:C.mute,ls:4,a});
   chip(560,204,'with Lumen',C.npu,a);
   [['see defects',.25],['count objects',.4],['read text',.55]].forEach(([s,f],i)=>{const b=ramp(t,d*f,d*f+.4),y=330+i*110;
     T(s,160,y,{s:44,w:700,a:b});T('✓',690,y,{s:44,w:700,al:'right',c:C.ok,a:b})});
   const q=ramp(t,d*.78,d*.88);L([[160,620],[700,620]],{c:C.dim,lw:1.5,a:q});T('explain',160,700,{s:44,w:700,c:C.dim,a:q});
   T('?',690,700,{s:44,w:700,al:'right',c:C.amber,a:q*(.6+.4*Math.sin(t*4))});}},
 {id:'night',see:'An HMI at 02:47: line 3 stopped, E-417 blinking red; an 800-page manual and an empty expert chair.',draw(t,d){ground(t,.2);const a=ramp(t,.2,.8);
   R(160,150,1000,640,{r:14,f:'#0a0f2e',s:'rgba(127,138,184,.5)',lw:3,a});R(160,150,1000,70,{r:14,f:'rgba(127,138,184,.15)',a});
   T('LINE 3 · FZ-300',196,197,{s:26,w:700,c:C.mute,ls:3,a});T('02:47',1124,197,{s:30,w:700,al:'right',mono:true,a});
   const al=ramp(t,d*.25,d*.3),bl=.65+.35*Math.round(.5+.5*Math.sin(t*7));R(200,270,920,140,{r:8,f:`rgba(255,106,61,${.18*al*bl})`,s:C.nok,lw:3,a:al});
   T('E-417',236,360,{s:72,w:700,c:C.nok,mono:true,a:al*bl});T('Übertemperatur Spindelmotor',480,355,{s:34,c:C.txt,a:al});
   T('SPINDLE STOPPED · PRODUCTION HALTED',200,470,{s:24,c:C.nok,ls:3,a:ramp(t,d*.35,d*.45)});
   for(let k=0;k<5;k++)R(200+k*186,520,170,230,{r:6,s:'rgba(74,80,112,.6)',lw:1.5,a,f:'rgba(20,26,70,.6)'});
   const m=ramp(t,d*.55,d*.65);R(1260,250,520,300,{r:8,f:C.panel,s:'rgba(0,153,153,.35)',lw:1.5,a:m});
   for(let k=0;k<9;k++)R(1300+k*6,300+k*5,170,210,{r:3,f:'#d9dbe6',s:'#8a8fa8',lw:1,a:m*(.5+k*.05)});
   T('MANUAL',1530,350,{s:22,c:C.mute,ls:3,a:m});T('800+',1530,420,{s:64,w:700,mono:true,a:m});T('pages',1530,460,{s:24,c:C.mute,a:m});
   const e=ramp(t,d*.75,d*.85);R(1260,600,520,190,{r:8,f:C.panel,s:'rgba(0,153,153,.35)',lw:1.5,a:e});
   T('EXPERT',1300,660,{s:22,c:C.mute,ls:3,a:e});T('on holiday',1300,730,{s:52,w:700,c:C.amber,a:e});}},
 {id:'llm',see:'A big GPU card and a cloud: where language models usually live. Both stay outside, dimmed.',draw(t,d){ground(t,.2);const a=ramp(t,.3,.9);
   T('LANGUAGE MODEL',W/2,190,{s:26,al:'center',c:C.npuHi,ls:8,a});T('billions of parameters',W/2,240,{s:30,al:'center',c:C.mute,a:ramp(t,.6,1.2)});
   const b=ramp(t,d*.4,d*.5),dimx=1-.55*ramp(t,d*.85,d);g.save();g.globalAlpha=dimx;
   R(260,380,640,300,{r:12,f:'rgba(169,143,214,.08)',s:C.gpu,lw:2.5,a:b});[0,1].forEach(k=>{g.save();g.globalAlpha*=b;g.beginPath();g.arc(430+k*300,530,105,0,6.29);g.strokeStyle=C.gpu;g.lineWidth=2;g.stroke();
